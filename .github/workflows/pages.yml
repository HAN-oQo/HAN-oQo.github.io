name: Deploy to GitHub Pages

# Deploys the static site to GitHub Pages on every push to main.
# Pages source must be set to "GitHub Actions" in Settings → Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 테마/포맷 일관성 검사 — 실패하면 배포되지 않는다 (규약: CLAUDE.md)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check theme & format consistency
        run: python3 tools/check_theme.py --git HEAD

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
