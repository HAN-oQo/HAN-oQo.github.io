name: Deploy to GitHub Pages

# Pages를 켤 준비가 되면(유료 플랜의 private repo 또는 public repo로 전환 후)
# GitHub repo → Settings → Pages → Build and deployment → Source: "GitHub Actions"
# 로 설정하면 이 워크플로가 정적 사이트를 자동 배포합니다.
# 그 전까지는 실행돼도 Pages 미설정으로 배포 단계에서 스킵/실패할 수 있습니다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
